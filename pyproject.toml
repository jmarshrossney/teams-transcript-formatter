[build-system]
requires = ["uv_build>=0.9.5,<0.10.0"]
build-backend = "uv_build"

[project]
name = "teams-transcript-formatter"
version = "0.3.2"
authors = [{name = "Joe Marsh Rossney", email = "17361029+jmarshrossney@users.noreply.github.com"}]
description = "Human-readable Microsoft Teams meeting transcripts"
readme = "README.md"
requires-python = ">= 3.12"
dependencies = [
    "typer>=0.15",
    "rich>=13",
]

[project.urls]
Repository = "https://github.com/jmarshrossney/teams-transcript-formatter"

[project.scripts]
teams-transcript-formatter = "teams_transcript_formatter.cli:app"

[dependency-groups]
dev = [
    "pre-commit>=4.6.0",
    "pyright>=1.1.409",
    "pytest>=9.0.3",
    "ruff>=0.15.12",
    "rust-just>=1.50.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.ruff.format]
quote-style = "double"
